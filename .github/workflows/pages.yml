name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04      # Playwright 1.49 browser dependencies are packaged for 24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # full history: the build number is the commit count
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Install test browsers
        timeout-minutes: 20
        run: npx playwright install --with-deps chromium webkit || (sleep 15 && npx playwright install --with-deps chromium webkit)
      - run: npm test
      - uses: actions/upload-artifact@v5
        with:
          name: site
          path: dist
  deploy:
    needs: test                   # a failing test blocks the deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
